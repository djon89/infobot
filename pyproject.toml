[project]
name = "infobot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.34.0",
  "arq==0.28.0",
  "anthropic==2.14.0",
  "youtube-transcript-api==1.2.5",
  "sqlalchemy[asyncio]==2.1.9",
  "asyncpg>=0.30",
  "pydantic-settings==2.16.3",
  "httpx>=0.27",
  "yt-dlp[default]==2026.11.23",
  "bgutil-ytdlp-pot-provider==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "aiosqlite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
