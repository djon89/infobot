services:
  bot:
    build: .
    image: infobot-worker
    command: python -m app.bot.main
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    image: infobot-worker
    command: arq app.worker.main.WorkerSettings
    env_file: .env
    restart: unless-stopped
    volumes: [backups:/backups:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # отдельный воркер скачиваний: долгие загрузки не задерживают конспекты
  worker-dl:
    build: .
    image: infobot-worker
    command: arq app.worker.main.DownloadWorkerSettings
    env_file: .env
    restart: unless-stopped
    volumes: [downloads:/data/downloads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # резервная копия базы раз в сутки (14 дней), раз в неделю приходит владельцу в Telegram
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment: {PGPASSWORD: bot}
    volumes: ["./deploy/backup.sh:/backup.sh:ro", "backups:/backups"]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}

  # PO-токены для YouTube: без них YouTube часто не отдаёт видео серверам
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped

  # Свой сервер Telegram Bot API: отправка файлов до 2 ГБ (облачный — только 50 МБ).
  # Включается, когда в .env есть COMPOSE_PROFILES=localapi и TELEGRAM_API_ID/HASH.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.5
    profiles: [localapi]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tgapi:/var/lib/telegram-bot-api
      - downloads:/data/downloads:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  downloads:
  tgapi:
  backups:
  redisdata:
